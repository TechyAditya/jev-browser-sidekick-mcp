name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A rewritten manifest ships silently. 0.1.1 went out with both bin
      # entries stripped because this check did not exist.
      - name: Verify npm does not rewrite the manifest
        run: |
          npm publish --dry-run 2>&1 | tee publish-check.log
          if grep -q "auto-corrected" publish-check.log; then
            echo "::error::npm rewrote package.json while packing. Refusing to publish."
            exit 1
          fi

      - name: Publish package
        run: npm publish --provenance --access public
